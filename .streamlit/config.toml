# Dark command-console theme by default, matching pipeline/ui.py's
# DARK_TOKENS -- dark is the app's primary look (the in-app sidebar
# toggle switches pipeline/ui.py's own CSS to LIGHT_TOKENS at runtime,
# but Streamlit's native chrome -- buttons, inputs, this config -- can
# only be set statically here, so it defaults to match the primary look).
[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#080b14"
secondaryBackgroundColor = "#111827"
textColor = "#f3f6ff"

[server]
headless = true

[browser]
gatherUsageStats = false
