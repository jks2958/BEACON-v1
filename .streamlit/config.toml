# Light product-console theme, at the user's direction (replaces the
# earlier dark SOC-console skin). These values match pipeline/ui.py's
# TOKENS and pipeline/viz.py's LIGHT palette -- change all three together.
[theme]
base = "light"
primaryColor = "#3d63e0"
backgroundColor = "#f5f7fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#151b2c"

[server]
headless = true

[browser]
gatherUsageStats = false
